<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’EORA Image Reader V1</title>
<style>
:root{--bg:#07191b;--panel:#0c2528;--line:#27565a;--gold:#d5ad68;--text:#f3efe5;--muted:#aebcbc;--teal:#16858b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#103438 0,#07191b 38%,#041113 100%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.brand{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #3b5a52;padding-bottom:18px;margin-bottom:22px}.brand h1{margin:0;color:var(--gold);font:42px/1 Georgia,serif;letter-spacing:.18em}.brand small{letter-spacing:.25em;color:#e7c78f}.tag{color:#d9d0bf}.panel,.card{background:linear-gradient(145deg,rgba(14,48,51,.94),rgba(4,24,27,.96));border:1px solid var(--line);border-radius:20px;padding:18px}.upload{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.preview{min-height:320px;border:1px dashed #47777a;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:#061416}.preview img{width:100%;height:100%;object-fit:cover;display:none}.controls h2{font:28px Georgia,serif;margin:4px 0 8px}.controls p{color:var(--muted)}textarea{width:100%;min-height:100px;border-radius:12px;border:1px solid #3e6567;background:#08191b;color:white;padding:12px;resize:vertical}button,.filebtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;font-weight:700;cursor:pointer}.filebtn{background:var(--gold);color:#17201e;width:100%;margin:8px 0}input[type=file]{display:none}.generate{width:100%;margin-top:12px;background:linear-gradient(90deg,var(--teal),var(--gold));color:white;font-size:17px}.generate:disabled{opacity:.55}.status{min-height:24px;color:#d9c18f;margin-top:8px}.results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{position:relative;min-height:145px}.card.wide{grid-column:1/-1}.label{font-size:12px;letter-spacing:.18em;color:#d9c18f;font-weight:800}.value{font:22px Georgia,serif;margin-top:12px;white-space:pre-wrap}.value.body{font:16px/1.65 system-ui}.copy{position:absolute;right:12px;top:10px;background:#17383b;color:#dce7e7;padding:7px 11px;font-size:12px}.footer{text-align:center;color:#b49b70;letter-spacing:.18em;padding:26px 0}.hidden{display:none}@media(max-width:720px){.upload,.results{grid-template-columns:1fr}.brand{align-items:start;gap:10px;flex-direction:column}.brand h1{font-size:34px}.preview{min-height:260px}.card.wide{grid-column:auto}}
</style></head><body><main class="wrap"><header class="brand"><div><h1>L’EORA</h1><small>EAST × WEST MASTERCLASS</small></div><div class="tag">See deeper. Think wider. Create meaning.</div></header>
<section class="panel upload"><div class="preview"><span id="placeholder">Your image will appear here</span><img id="img" alt="Selected image preview"></div><div class="controls"><h2>Content Image Reader <span style="color:var(--gold)">V1</span></h2><p>Upload one image. I will read what is visible, find the deeper idea, and create your L’EORA-ready content package.</p><label class="filebtn" for="file">Choose Image</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><textarea id="context" placeholder="Optional context: What is this moment about? Leave blank if you want the image to speak for itself."></textarea><button class="generate" id="go" disabled>READ IMAGE & GENERATE</button><div class="status" id="status"></div></div></section>
<section class="results hidden" id="results"></section><div class="footer">L’EORA · A LEGACY TO LIVE</div></main>
<script>
const file=document.querySelector('#file'),img=document.querySelector('#img'),go=document.querySelector('#go'),status=document.querySelector('#status'),results=document.querySelector('#results');let dataUrl='';
file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>12*1024*1024){status.textContent='Please choose an image under 12 MB.';return}const r=new FileReader();r.onload=()=>{dataUrl=r.result;img.src=dataUrl;img.style.display='block';document.querySelector('#placeholder').style.display='none';go.disabled=false;status.textContent='Image ready.'};r.readAsDataURL(f)};
const defs=[['interpretation','IMAGE INTERPRETATION','body','wide'],['title','TITLE','',''],['quote','ORIGINAL L’EORA QUOTE','',''],['inspiring_phrase','INSPIRING PHRASE','',''],['caption','CAPTION','body','wide'],['inlay_text','INLAY TEXT','',''],['hashtags','5 RELEVANT HASHTAGS','body',''],['east_west_lens','EAST × WEST LENS','body','wide']];
function render(d){results.innerHTML='';for(const [key,label,kind,wide] of defs){let v=d[key]??'';if(Array.isArray(v))v=v.join(' ');const c=document.createElement('article');c.className='card '+wide;c.innerHTML=`<div class="label">${label}</div><button class="copy">COPY</button><div class="value ${kind}"></div>`;c.querySelector('.value').textContent=v;c.querySelector('.copy').onclick=async()=>{await navigator.clipboard.writeText(v);c.querySelector('.copy').textContent='COPIED';setTimeout(()=>c.querySelector('.copy').textContent='COPY',1000)};results.appendChild(c)}results.classList.remove('hidden');results.scrollIntoView({behavior:'smooth'})}
go.onclick=async()=>{go.disabled=true;status.textContent='Reading the image and developing the East × West interpretation…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageDataUrl:dataUrl,context:document.querySelector('#context').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Generation failed');render(d);status.textContent='Complete.'}catch(e){status.textContent='Error: '+e.message}finally{go.disabled=false}};
</script></body></html>
